---
# Hadolint configuration for the reusable hassio-addons CI's hadolint job
# (brpaz/hadolint-action, invoked against headscale/Dockerfile).
#
# NOTE: this does not mirror an existing hassio-addons/app-adguard-home
# .hadolint.yaml — that file does not exist upstream (verified via the
# GitHub API against hassio-addons/app-adguard-home and sibling app-*
# repos, none of which carry a root-level .hadolint.yaml). Their actual
# convention is to pin every `apk add` package to an exact version (sidesteps
# DL3018 entirely) and to add an inline `# hadolint ignore=DL3006` comment
# directly above `FROM ${BUILD_FROM}`. This repo's Dockerfile currently does
# neither, so ignoring the two rules here at the repo level is the minimal
# fix to keep the reusable CI's hadolint job passing.
ignored:
  # ARG-parameterized FROM (`FROM ${BUILD_FROM}`) — hadolint can't statically
  # verify the resolved base image tag is pinned. build.yaml / the
  # `Base image pins match` CI check are the real guard here.
  - DL3006
  # `apk add --no-cache` without exact `=version-r#` pins on every package.
  - DL3018
