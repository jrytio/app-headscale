---
version: 2
updates:
  - package-ecosystem: docker
    directory: /headscale
    schedule:
      interval: daily
    labels:
      - dependencies
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    cooldown:
      default-days: 7
