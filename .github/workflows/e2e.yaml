---
name: E2E

# yamllint disable-line rule:truthy
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  e2e:
    name: Supervisor e2e
    runs-on: ubuntu-latest
    # Cold nested-Docker boot (devcontainer pull + in-supervisor image build
    # from 4 uncached base images) has been observed to eat a large chunk of
    # the previous 45m budget before the addon container even starts its
    # health-check start-period; the warm-pull step below shrinks that, but
    # keep a generous ceiling so a genuinely-slow (not hung) runner still
    # gets a real diagnostics dump instead of a hard cancellation.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Free disk space + warm devcontainer image pull (parallel)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc &
          docker pull ghcr.io/home-assistant/devcontainer:5-apps &
          wait
      - name: Run e2e suite
        run: ./test/e2e.sh
      - name: Diagnostics note
        if: failure()
        run: |
          echo "test/e2e.sh dumps supervisor log tail, addon logs, and 'docker ps -a' inline" \
               "BEFORE tearing the supervisor container down (search the 'Run e2e suite' step" \
               "log above for 'FAILURE DIAGNOSTICS') — the supervisor container itself does not" \
               "survive past that step, so there is nothing left here to fetch."
