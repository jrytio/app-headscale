name: Headscale
version: 0.7.0
slug: headscale
description: Self-hosted Tailscale control server with web UI
url: https://github.com/jrytio/app-headscale
ingress: true
ingress_port: 0
panel_icon: mdi:vpn
panel_title: Headscale
startup: services
arch:
  - aarch64
  - amd64
init: false
image: ghcr.io/jrytio/{arch}-addon-headscale
ports:
  8443/tcp: 443
  8081/tcp: 80
  3478/udp: 3478
  8080/tcp: null
ports_description:
  8443/tcp: Headscale server (HTTPS) — forward router port 443 here
  8081/tcp: Let's Encrypt challenge / HTTP mode — forward router port 80 here
  3478/udp: STUN relay
  8080/tcp: Headplane direct access (bypasses Home Assistant auth — leave disabled unless you need it)
hassio_api: true
map:
  - ssl
options:
  server_url: ""
  log_level: info
  acme_email: ""
  users: []
  subnet_router:
    enabled: false
    exit_node: false
schema:
  server_url: url
  log_level: list(trace|debug|info|warning|error)
  acme_email: "str?"
  users:
    - str
  subnet_router:
    enabled: bool
    exit_node: bool
backup_exclude:
  - "*/headscale/noise_private.key"
  - "*/headscale/derp_server_private.key"
  - "*/headplane/api_key"
  - "*/headplane/cookie_secret"
